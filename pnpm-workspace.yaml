packages:
  - "packages/*"

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  workerd: true

catalog:
  "@cloudflare/vitest-plugin": ^1.8.4
  "@web3-storage/data-segment": ^5.3.0
  mocha: ^12.0.3
  typescript: ^7.0.2
  vitest: ^5.1.1

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.13"
  - "@turbo/darwin-arm64@2.11.13"
  - "@turbo/linux-64@2.11.13"
  - "@turbo/linux-arm64@2.11.13"
  - "@turbo/windows-64@2.11.13"
  - "@turbo/windows-arm64@2.11.13"
  - turbo@2.11.13

overrides:
  # playwright-test 15.0.1 pins 1.63.0, whose Firefox 155 fails to start on
  # macOS 27 ("Could not find profile folder"); 1.65 ships Firefox 159
  playwright-core: 1.65.1
