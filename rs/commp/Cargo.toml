[package]
name = "commp-wasm"
version = "0.1.0"
edition = "2021"
description = "Fast CommP (Filecoin Piece Commitment) implementation for WASM"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bench.rs"

[dependencies]
# no_std on wasm32 (see lib.rs), so panics and allocation failures trap
# instead of pulling in std's formatting and dlmalloc
wasm-bindgen = { version = "0.2", default-features = false }
# Scalar SHA-256 (raw `compress256` only) for zero commitments, lone leftover
# nodes and native builds. On wasm32, +simd128 selects its SIMD message
# schedule; leaves and tree nodes are hashed 4 at a time by the crate's own
# `simd` module.
sha2 = { version = "0.11", default-features = false }

# Smaller than std's dlmalloc; realloc-in-place is unused and costs size
[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = { version = "5.1.1", features = ["disable-realloc-in-place"] }

[profile.release]
# Maximum optimization level
opt-level = 3
# Link-time optimization for smaller, faster code
lto = "fat"
# Single codegen unit for better optimization across the whole crate
codegen-units = 1
# Strip debug symbols
strip = true
# Optimize for size can sometimes help with WASM cache efficiency
# Uncomment if you prefer smaller size over raw speed:
# opt-level = "z"

[profile.release.package."*"]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
# Maximum wasm-opt optimization with bulk memory and SIMD
# --strip-producers drops toolchain metadata so builds are reproducible across machines
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-simd", "--strip-producers"]
