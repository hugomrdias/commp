[package]
name = "commp-wasm"
version = "0.1.0"
edition = "2021"
description = "Fast CommP (Filecoin Piece Commitment) implementation for WASM"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bench.rs"

[dependencies]
wasm-bindgen = "0.2"
# Scalar SHA-256 for zero commitments, odd batch remainders and native builds.
# On wasm32, +simd128 selects its SIMD message schedule; leaves and tree nodes
# are hashed 4 at a time by the crate's own `simd` module.
sha2 = { version = "0.11", default-features = false }

[profile.release]
# Maximum optimization level
opt-level = 3
# Link-time optimization for smaller, faster code
lto = "fat"
# Single codegen unit for better optimization across the whole crate
codegen-units = 1
# Strip debug symbols
strip = true
# Optimize for size can sometimes help with WASM cache efficiency
# Uncomment if you prefer smaller size over raw speed:
# opt-level = "z"

[profile.release.package."*"]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
# Maximum wasm-opt optimization with bulk memory and SIMD
# --strip-producers drops toolchain metadata so builds are reproducible across machines
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-simd", "--strip-producers"]
