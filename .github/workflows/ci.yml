name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with the local toolchain used to build the committed inline WASM
  WASM_PACK_VERSION: 0.13.1
  BINARYEN_VERSION: '114'

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rs/commp
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs/commp
      - run: cargo test --lib --tests
      - run: cargo test --lib --tests --features parallel
      - run: cargo build --lib --release --target wasm32-unknown-unknown

  check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs pnpm (packageManager) and Node (devEngines.runtime) from
      # package.json, then runs `pnpm install --frozen-lockfile`
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Rebuild the inline WASM and fail if it differs from the committed copy
      - run: rustup show
        working-directory: rs/commp
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs/commp
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}
      - name: Install binaryen
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - run: pnpm build:wasm
      - name: Check inline WASM is up to date
        run: |
          if ! git diff --exit-code --stat -- packages/commp-wasm/src/inline; then
            echo "::error::Inline WASM is stale. Run 'pnpm build:wasm' and commit the result."
            exit 1
          fi

      - name: Build packages
        run: pnpm build

      - name: Run checks
        run: pnpm check
